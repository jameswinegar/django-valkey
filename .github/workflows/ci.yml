name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR: a force-push cancels the run for the superseded
# commit instead of queueing a second full matrix behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `uv run` re-syncs the environment against the lockfile before every
  # command, which would silently reinstall the resolved (newest) Django over
  # the matrix version installed below. Disable that for the whole job; the
  # explicit `uv sync` step is unaffected.
  UV_NO_SYNC: '1'

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Django main is allowed to break without failing the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        # A series, not a release: the install step expands '5.2' to
        # `django~=5.2.0`, so every patch release of the series is tested.
        django-version:
          - '5.2'
          - '6.0'
          - '6.1'
        experimental:
          - false

        include:
          - python-version: '3.13'
            django-version: main
            experimental: true
          - python-version: '3.14'
            django-version: main
            experimental: true

        # Django 6.x requires Python 3.12+.
        exclude:
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.11'
            django-version: '6.0'
          - python-version: '3.10'
            django-version: '6.1'
          - python-version: '3.11'
            django-version: '6.1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Django ${{ matrix.django-version }}
        env:
          DJANGO: ${{ matrix.django-version }}
        run: |
          if [ "$DJANGO" = main ]; then
            uv pip install "django @ git+https://github.com/django/django.git@main"
          else
            uv pip install "django~=$DJANGO.0"
          fi

      - name: Check the installed Django matches the matrix
        env:
          DJANGO: ${{ matrix.django-version }}
        # Guards against the environment being re-synced over the matrix
        # version, which is exactly what happened before UV_NO_SYNC was set.
        run: |
          uv run python - <<'PY'
          import os
          import django

          wanted = os.environ["DJANGO"]
          got = django.__version__
          print(f"Django {got}")
          if wanted == "main":
              assert ".dev" in got, f"expected a Django main checkout, got {got}"
          else:
              assert got.startswith(f"{wanted}."), f"expected Django {wanted}.x, got {got}"
          PY

      - name: Start Valkey services
        # `invoke devenv` runs `docker compose up --wait`, which returns once
        # every service's healthcheck passes, including cluster_state:ok.
        run: uv run invoke devenv

      - name: Run tests
        run: |
          uv run pytest tests/*.py --ds=tests.settings.sqlite -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_herd -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_json -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_msgspec_json -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_msgspec_msgpack -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_msgpack -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_sentinel -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_sentinel_opts -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_sharding -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_zlib -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_zstd -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_gzip -x
          uv run pytest tests/*.py --ds=tests.settings.sqlite_bz2 -x
          uv run pytest tests/tests_async/*.py --ds=tests.settings.sqlite_async -x
          uv run pytest tests/tests_async/*.py --ds=tests.settings.sqlite_async_herd -x
          uv run pytest tests/*.py tests/tests_cluster --ds=tests.settings.sqlite_cluster -x
#          uv run pytest tests/*.py --ds=tests.settings.sqlite_usock -x
