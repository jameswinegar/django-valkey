name: Support matrix

# Compares the Python/Django versions declared in pyproject.toml against
# upstream release schedules and files an issue when they drift: a series
# going end-of-life, a new one shipping, or a dependency floor disagreeing
# with the classifiers. Deliberately not part of CI: the check talks to
# endoflife.date, and a live external API should not fail a pull request.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC
  workflow_dispatch:

# The find-then-create sequence below is not atomic; queue rather than cancel
# so a manual dispatch never discards a scheduled run's result.
concurrency:
  group: support-matrix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check declared versions against upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'  # the checker is stdlib-only

      - name: Check support matrix
        id: check
        # Exit 1 means drift, which is a finding rather than a failure: record
        # it and let the reporting steps act on it.
        run: |
          set +e
          python util/check_support_matrix.py --format md > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md

      - name: Ensure tracking label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create support-matrix --force --color FBCA04 --description "Declared support matrix vs upstream release schedules"

      - name: Find existing drift issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --label support-matrix --limit 1 --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING: ${{ steps.existing.outputs.number }}
        run: |
          {
            echo "Detected by the \`support-matrix\` workflow on $(date -u +%Y-%m-%d) against <https://endoflife.date>."
            echo
            cat report.md
            echo
            echo "Reproduce locally with \`python util/check_support_matrix.py\`."
            echo "This issue is rewritten on each run and closed automatically once the matrix is current again."
          } > issue.md

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file issue.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create \
              --title "Support matrix has drifted from upstream release schedules" \
              --label support-matrix \
              --body-file issue.md
          fi

      - name: Close a stale drift issue
        if: steps.check.outputs.status == '0' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING: ${{ steps.existing.outputs.number }}
        run: gh issue close "$EXISTING" --comment "The declared support matrix matches upstream release schedules again; closing automatically."

      - name: Fail if the check itself errored
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "::error::check_support_matrix.py exited with $STATUS"
          exit 1
